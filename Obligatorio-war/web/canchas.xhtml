<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <h:head>
        <title>Canchas</title>
        <link rel="stylesheet" href="resources/css/estilo.css" />
    </h:head>
    <h:body>
        <h1>Gestión de Canchas</h1>

        <h:form id="formCancha">
            <h:messages globalOnly="true" showDetail="false" />

            <h2>Nueva / Editar Cancha</h2>
            <h:panelGrid columns="2" cellpadding="4">
                <h:outputLabel for="descripcion" value="Descripción:" />
                <h:panelGroup rendered="#{not empty canchaBean.canchaSeleccionada}">
                    <h:inputText id="descripcion" required="true"
                                 value="#{canchaBean.canchaSeleccionada.descripcion}" />
                    <h:message for="descripcion" styleClass="error-message" />
                </h:panelGroup>

                <h:outputLabel for="deporte" value="Deporte:" />
                <h:panelGroup rendered="#{not empty canchaBean.canchaSeleccionada}">
                    <h:inputText id="deporte" required="true"
                                 value="#{canchaBean.canchaSeleccionada.deporte}" />
                    <h:message for="deporte" styleClass="error-message" />
                </h:panelGroup>

                <h:panelGroup rendered="#{empty canchaBean.canchaSeleccionada}">
                    <h:commandButton value="Nueva" action="#{canchaBean.nuevaCancha}" />
                </h:panelGroup>
                <h:panelGroup rendered="#{not empty canchaBean.canchaSeleccionada}">
                    <h:commandButton value="Guardar" action="#{canchaBean.guardar}" />
                    <h:commandButton value="Cancelar" action="#{canchaBean.cancelar}" />
                </h:panelGroup>
            </h:panelGrid>
        </h:form>

        <h:form>
            <h2>Canchas registradas</h2>
            <h:dataTable value="#{canchaBean.canchas}" var="c" styleClass="tabla-datos">
                <h:column>
                    <f:facet name="header">Código</f:facet>
                    #{c.codigo}
                </h:column>
                <h:column>
                    <f:facet name="header">Descripción</f:facet>
                    #{c.descripcion}
                </h:column>
                <h:column>
                    <f:facet name="header">Deporte</f:facet>
                    #{c.deporte}
                </h:column>
                <h:column>
                    <f:facet name="header">Acciones</f:facet>
                    <h:commandButton value="Editar" action="#{canchaBean.seleccionar(c)}" />
                    <h:commandButton value="Eliminar"
                                     action="#{canchaBean.eliminar(c)}"
                                     onclick="return confirm('¿Eliminar la cancha #{c.descripcion}?');" />
                </h:column>
            </h:dataTable>
            <p><h:commandLink value="Volver" action="index.xhtml" /></p>
        </h:form>
    </h:body>
</html>
